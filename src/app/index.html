<!-- PROTOTYPE FRONTEND GENERATED USING CLAUDE TO TEST DB QUERIES -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music.</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── CONFIG: plug your base URL here ── */
      /* edit API_BASE in the <script> section below */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0d;
        --surface: #161616;
        --border: #262626;
        --muted: #555;
        --text: #e8e8e0;
        --accent: #c8f060;
        --accent2: #f06060;
        --mono: "DM Mono", monospace;
        --serif: "Instrument Serif", serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── NAV ── */
      nav {
        display: flex;
        align-items: center;
        gap: 0;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 100;
      }
      .logo {
        font-family: var(--serif);
        font-style: italic;
        font-size: 22px;
        color: var(--accent);
        padding: 14px 24px 14px 0;
        border-right: 1px solid var(--border);
        margin-right: 24px;
        letter-spacing: -0.5px;
      }
      .nav-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 18px 16px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition:
          color 0.15s,
          border-color 0.15s;
        position: relative;
        top: 1px;
      }
      .nav-btn:hover {
        color: var(--text);
      }
      .nav-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }

      /* ── MAIN ── */
      main {
        flex: 1;
        padding: 32px 24px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
      }

      .page {
        display: none;
      }
      .page.active {
        display: block;
      }

      .page-title {
        font-family: var(--serif);
        font-style: italic;
        font-size: 32px;
        color: var(--text);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }
      .page-subtitle {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }

      /* ── BACK BUTTON ── */
      .back-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 6px 12px;
        cursor: pointer;
        margin-bottom: 24px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .back-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      /* ── LIST ── */
      .list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .list-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        background: var(--surface);
        cursor: pointer;
        transition: background 0.1s;
        border-left: 3px solid transparent;
      }
      .list-item:hover {
        background: #1e1e1e;
        border-left-color: var(--accent);
      }

      .item-thumb {
        width: 44px;
        height: 44px;
        border-radius: 2px;
        background: var(--border);
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--muted);
      }
      .item-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item-info {
        flex: 1;
        min-width: 0;
      }
      .item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .item-duration {
        font-size: 11px;
        color: var(--muted);
        min-width: 36px;
        text-align: right;
      }

      .play-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .play-btn:hover {
        transform: scale(1.1);
        background: #d8ff70;
      }
      .play-btn svg {
        margin-left: 2px;
      }

      .arrow-btn {
        width: 30px;
        height: 30px;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .arrow-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      .type-badge {
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 2px 6px;
        flex-shrink: 0;
      }

      /* ── LOADING / ERROR ── */
      .state-msg {
        padding: 48px 0;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .state-msg.error {
        color: var(--accent2);
      }

      /* ── PLAYER ── */
      #player-page {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        gap: 0;
      }
      #player-page.active {
        display: flex;
      }

      .player-art {
        width: 240px;
        height: 240px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        color: var(--muted);
        margin-bottom: 32px;
        position: relative;
        overflow: hidden;
      }
      .player-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .player-art.spinning::after {
        content: "";
        position: absolute;
        inset: 0;
        background: conic-gradient(
          transparent 0deg,
          rgba(200, 240, 96, 0.08) 360deg
        );
        animation: spin 4s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .player-track {
        font-family: var(--serif);
        font-style: italic;
        font-size: 28px;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }
      .player-artist {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 40px;
      }

      .progress-wrap {
        width: 320px;
        margin-bottom: 12px;
      }
      .progress-bar {
        width: 100%;
        height: 3px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 1s linear;
      }
      .progress-times {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }

      .player-controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
      }
      .ctrl-btn {
        width: 40px;
        height: 40px;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .ctrl-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }
      .ctrl-play {
        width: 52px;
        height: 52px;
        background: var(--accent);
        border: none;
        color: #0d0d0d;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
      }
      .ctrl-play:hover {
        transform: scale(1.05);
      }

      .player-audio {
        display: none;
      }

      /* ── DETAIL HEADER ── */
      .detail-header {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 32px;
      }
      .detail-art {
        width: 120px;
        height: 120px;
        background: var(--surface);
        border: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: var(--muted);
        overflow: hidden;
      }
      .detail-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .detail-info {
        flex: 1;
      }
      .detail-type {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .detail-title {
        font-family: var(--serif);
        font-style: italic;
        font-size: 28px;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
      }
      .detail-meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">music.</div>
      <button class="nav-btn active" onclick="showTab('songs')">Songs</button>
      <button class="nav-btn" onclick="showTab('albums')">Albums</button>
      <button class="nav-btn" onclick="showTab('artists')">Artists</button>
      <button class="nav-btn" onclick="showTab('import')">+ Import</button>
    </nav>

    <main>
      <!-- SONGS -->
      <div id="songs-page" class="page active">
        <div class="page-title">Songs</div>
        <div class="page-subtitle" id="songs-subtitle">Loading…</div>
        <div class="list" id="songs-list"></div>
      </div>

      <!-- ALBUMS -->
      <div id="albums-page" class="page">
        <div class="page-title">Albums</div>
        <div class="page-subtitle" id="albums-subtitle">Loading…</div>
        <div class="list" id="albums-list"></div>
      </div>

      <!-- ARTISTS -->
      <div id="artists-page" class="page">
        <div class="page-title">Artists</div>
        <div class="page-subtitle" id="artists-subtitle">Loading…</div>
        <div class="list" id="artists-list"></div>
      </div>

      <!-- IMPORT -->
      <div id="import-page" class="page">
        <div class="page-title">Import</div>
        <div class="page-subtitle">
          Paste a song or playlist URL to add it to your library
        </div>
        <div style="max-width: 480px; margin-top: 8px">
          <textarea
            id="import-url"
            placeholder="https://youtube.com/watch?v=..."
            style="
              width: 100%;
              height: 100px;
              background: var(--surface);
              border: 1px solid var(--border);
              color: var(--text);
              font-family: var(--mono);
              font-size: 13px;
              padding: 12px;
              resize: vertical;
              outline: none;
            "
          ></textarea>
          <div
            id="import-status"
            style="
              font-size: 12px;
              color: var(--muted);
              margin: 8px 0;
              min-height: 18px;
            "
          ></div>
          <button
            onclick="submitImport()"
            style="
              background: var(--accent);
              border: none;
              color: #0d0d0d;
              font-family: var(--mono);
              font-size: 12px;
              letter-spacing: 0.08em;
              text-transform: uppercase;
              padding: 10px 24px;
              cursor: pointer;
              transition: opacity 0.15s;
            "
            onmouseover="this.style.opacity = 0.85"
            onmouseout="this.style.opacity = 1"
          >
            Submit
          </button>
        </div>
      </div>

      <!-- ALBUM DETAIL -->
      <div id="album-detail-page" class="page">
        <button class="back-btn" onclick="goBack()">← back</button>
        <div class="detail-header">
          <div class="detail-art" id="album-detail-art">💿</div>
          <div class="detail-info">
            <div class="detail-type">Album</div>
            <div class="detail-title" id="album-detail-title">—</div>
            <div class="detail-meta" id="album-detail-meta">—</div>
          </div>
        </div>
        <div class="list" id="album-tracks-list"></div>
      </div>

      <!-- ARTIST DETAIL -->
      <div id="artist-detail-page" class="page">
        <button class="back-btn" onclick="goBack()">← back</button>
        <div class="detail-header">
          <div class="detail-art">🎤</div>
          <div class="detail-info">
            <div class="detail-type">Artist</div>
            <div class="detail-title" id="artist-detail-title">—</div>
            <div class="detail-meta" id="artist-detail-meta">—</div>
          </div>
        </div>
        <div class="list" id="artist-tracks-list"></div>
      </div>

      <!-- PLAYER -->
      <div id="player-page" class="page">
        <button class="back-btn" onclick="goBack()">← back</button>
        <div
          style="
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 24px;
          "
        >
          <div class="player-art" id="player-art">♪</div>
          <div class="player-track" id="player-track">—</div>
          <div class="player-artist" id="player-artist">—</div>

          <div class="progress-wrap">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-times">
              <span id="time-current">0:00</span>
              <span id="time-total">0:00</span>
            </div>
          </div>

          <div class="player-controls">
            <button class="ctrl-btn" onclick="seekRelative(-10)" title="-10s">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
                />
                <text
                  x="12"
                  y="15"
                  font-size="6"
                  text-anchor="middle"
                  fill="currentColor"
                >
                  10
                </text>
              </svg>
            </button>
            <button
              class="ctrl-play"
              id="play-pause-btn"
              onclick="togglePlayPause()"
            >
              <svg
                id="play-icon"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path d="M8 5v14l11-7z" />
              </svg>
              <svg
                id="pause-icon"
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="display: none"
              >
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
              </svg>
            </button>
            <button class="ctrl-btn" onclick="seekRelative(10)" title="+10s">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"
                />
              </svg>
            </button>
          </div>

          <audio id="audio-player" class="player-audio"></audio>
        </div>
      </div>
    </main>

    <script>
      // ════════════════════════════════════════════
      //  CONFIG — edit this block
      // ════════════════════════════════════════════
      const API_BASE = "http://localhost:3000"; // ← your API base URL

      const ENDPOINTS = {
        songs: () => `${API_BASE}/tracks`,
        albums: () => `${API_BASE}/release-groups`,
        artists: () => `${API_BASE}/artists`,
        albumTracks: (id) => `${API_BASE}/release-groups/${id}/tracks`,
        artistTracks: (id) => `${API_BASE}/artists/${id}/tracks`,
        streamTrack: (id) => `${API_BASE}/tracks/${id}/stream`, // or /file
        importUrl: () => `${API_BASE}/import`,
      };
      // ════════════════════════════════════════════

      // ── State ──
      let currentTab = "songs";
      let previousPage = null;
      const audio = document.getElementById("audio-player");
      let progressInterval = null;

      // ── Helpers ──
      function fmt(ms) {
        if (!ms) return "?:??";
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }
      function fmtSec(s) {
        return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      }
      function fmtDate(ms) {
        if (!ms) return "—";
        return new Date(ms).getFullYear();
      }
      async function apiFetch(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      }

      // ── Navigation ──
      function showPage(id) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById(id).classList.add("active");
      }

      function showTab(tab) {
        currentTab = tab;
        previousPage = null;
        document.querySelectorAll(".nav-btn").forEach((b, i) => {
          b.classList.toggle(
            "active",
            ["songs", "albums", "artists"][i] === tab,
          );
        });
        showPage(`${tab}-page`);
        loadTabIfNeeded(tab);
      }

      function goBack() {
        if (previousPage) {
          showPage(previousPage);
          previousPage = null;
        } else {
          showTab(currentTab);
        }
      }

      // ── Tab loading ──
      const loaded = {};
      function loadTabIfNeeded(tab) {
        if (loaded[tab]) return;
        loaded[tab] = true;
        if (tab === "songs") loadSongs();
        if (tab === "albums") loadAlbums();
        if (tab === "artists") loadArtists();
      }

      // ── Songs ──
      async function loadSongs() {
        const list = document.getElementById("songs-list");
        const sub = document.getElementById("songs-subtitle");
        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.songs());
          const songs = data.data ?? (Array.isArray(data) ? data : []);
          sub.textContent = `${songs.length} tracks`;
          list.innerHTML = songs.length
            ? ""
            : '<div class="state-msg">No tracks found.</div>';
          songs.forEach((s) => list.appendChild(songItem(s)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function artistCredit(artists) {
        if (!artists || !artists.length) return "";
        return [...artists]
          .sort((a, b) => (a.pos ?? 0) - (b.pos ?? 0))
          .map((a) => a.name + (a.joinphrase ?? ""))
          .join("");
      }

      function songItem(s) {
        const el = document.createElement("div");
        el.className = "list-item";
        const credit = artistCredit(s.artists);
        const album = s.releaseGroup?.title ?? "";
        const meta = [credit, album].filter(Boolean).join(" · ");
        el.innerHTML = `
    <div class="item-thumb">♪</div>
    <div class="item-info">
      <div class="item-title">${s.title}</div>
      <div class="item-meta">${meta}</div>
    </div>
    <div class="item-right">
      <span class="item-duration">${fmt(s.length)}</span>
      <button class="play-btn" title="Play">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#0d0d0d"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  `;
        el.querySelector(".play-btn").onclick = (e) => {
          e.stopPropagation();
          openPlayer(s);
        };
        return el;
      }

      // ── Albums ──
      async function loadAlbums() {
        const list = document.getElementById("albums-list");
        const sub = document.getElementById("albums-subtitle");
        list.innerHTML = '<div class="state-msg">Loading albums…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.albums());
          const albums = Array.isArray(data)
            ? data
            : (data.release_groups ?? data.albums ?? data.data ?? []);
          sub.textContent = `${albums.length} releases`;
          list.innerHTML = albums.length
            ? ""
            : '<div class="state-msg">No albums found.</div>';
          albums.forEach((a) => list.appendChild(albumItem(a)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function albumItem(a) {
        const el = document.createElement("div");
        el.className = "list-item";
        el.innerHTML = `
    <div class="item-thumb">${a.cover_art_url ? `<img src="${a.cover_art_url}" alt="">` : "💿"}</div>
    <div class="item-info">
      <div class="item-title">${a.title}</div>
      <div class="item-meta">${fmtDate(a.first_release_date)}</div>
    </div>
    <div class="item-right">
      <span class="type-badge">${a.musicbrainz_primary_type ?? "album"}</span>
      <button class="arrow-btn" title="View album">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7V5z"/></svg>
      </button>
    </div>
  `;
        el.onclick = () => openAlbum(a);
        return el;
      }

      async function openAlbum(album) {
        previousPage = "albums-page";
        showPage("album-detail-page");

        const artEl = document.getElementById("album-detail-art");
        artEl.innerHTML = album.cover_art_url
          ? `<img src="${album.cover_art_url}" alt="">`
          : "💿";
        document.getElementById("album-detail-title").textContent = album.title;
        document.getElementById("album-detail-meta").innerHTML =
          `${album.musicbrainz_primary_type ?? "Album"} &nbsp;·&nbsp; ${fmtDate(album.first_release_date)}`;

        const list = document.getElementById("album-tracks-list");
        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.albumTracks(album.id));
          const tracks = Array.isArray(data)
            ? data
            : (data.tracks ?? data.data ?? []);
          list.innerHTML = tracks.length
            ? ""
            : '<div class="state-msg">No tracks found.</div>';
          tracks.forEach((s, i) => {
            const el = songItem(s);
            // prepend track number
            el.querySelector(".item-thumb").textContent = i + 1;
            list.appendChild(el);
          });
        } catch (e) {
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      // ── Artists ──
      async function loadArtists() {
        const list = document.getElementById("artists-list");
        const sub = document.getElementById("artists-subtitle");
        list.innerHTML = '<div class="state-msg">Loading artists…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.artists());
          const artists = Array.isArray(data)
            ? data
            : (data.artists ?? data.data ?? []);
          sub.textContent = `${artists.length} artists`;
          list.innerHTML = artists.length
            ? ""
            : '<div class="state-msg">No artists found.</div>';
          artists.forEach((a) => list.appendChild(artistItem(a)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function artistItem(a) {
        const el = document.createElement("div");
        el.className = "list-item";
        el.innerHTML = `
    <div class="item-thumb">🎤</div>
    <div class="item-info">
      <div class="item-title">${a.name}</div>
      <div class="item-meta">&nbsp;</div>
    </div>
    <div class="item-right">
      <button class="arrow-btn" title="View artist">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7V5z"/></svg>
      </button>
    </div>
  `;
        el.onclick = () => openArtist(a);
        return el;
      }

      async function openArtist(artist) {
        previousPage = "artists-page";
        showPage("artist-detail-page");

        document.getElementById("artist-detail-title").textContent =
          artist.name;
        document.getElementById("artist-detail-meta").textContent =
          "All tracks";

        const list = document.getElementById("artist-tracks-list");
        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.artistTracks(artist.id));
          const tracks = Array.isArray(data)
            ? data
            : (data.tracks ?? data.data ?? []);
          list.innerHTML = tracks.length
            ? ""
            : '<div class="state-msg">No tracks found.</div>';
          tracks.forEach((s) => list.appendChild(songItem(s)));
        } catch (e) {
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      // ── Player ──
      function openPlayer(song) {
        previousPage =
          document.querySelector(".page.active")?.id ?? `${currentTab}-page`;

        document.getElementById("player-track").textContent = song.title;
        document.getElementById("player-artist").textContent = fmtDate(
          song.first_release_date,
        );
        document.getElementById("time-total").textContent = fmt(song.length);
        document.getElementById("progress-fill").style.width = "0%";
        document.getElementById("time-current").textContent = "0:00";

        const artEl = document.getElementById("player-art");
        artEl.innerHTML = "♪";
        artEl.classList.remove("spinning");

        showPage("player-page");

        const streamUrl = ENDPOINTS.streamTrack(song.id);
        audio.src = streamUrl;
        audio.load();
        audio
          .play()
          .then(() => {
            artEl.classList.add("spinning");
            showPlayState(true);
          })
          .catch((err) => {
            console.warn("Autoplay blocked or stream failed:", err);
            showPlayState(false);
          });
      }

      function showPlayState(playing) {
        document.getElementById("play-icon").style.display = playing
          ? "none"
          : "";
        document.getElementById("pause-icon").style.display = playing
          ? ""
          : "none";
      }

      function togglePlayPause() {
        if (audio.paused) {
          audio.play();
          document.getElementById("player-art").classList.add("spinning");
          showPlayState(true);
        } else {
          audio.pause();
          document.getElementById("player-art").classList.remove("spinning");
          showPlayState(false);
        }
      }

      function seekRelative(secs) {
        audio.currentTime = Math.max(
          0,
          Math.min(audio.currentTime + secs, audio.duration || 0),
        );
      }

      audio.addEventListener("timeupdate", () => {
        const cur = audio.currentTime;
        const dur = audio.duration;
        if (!dur) return;
        document.getElementById("time-current").textContent = fmtSec(cur);
        document.getElementById("progress-fill").style.width =
          `${(cur / dur) * 100}%`;
      });

      audio.addEventListener("ended", () => {
        showPlayState(false);
        document.getElementById("player-art").classList.remove("spinning");
        document.getElementById("progress-fill").style.width = "100%";
      });

      // ── Import ──
      async function submitImport() {
        const url = document.getElementById("import-url").value.trim();
        const status = document.getElementById("import-status");
        if (!url) {
          status.textContent = "Please enter a URL.";
          status.style.color = "var(--accent2)";
          return;
        }
        status.style.color = "var(--muted)";
        status.textContent = "Submitting…";
        try {
          const r = await fetch(ENDPOINTS.importUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          status.style.color = "var(--accent)";
          status.textContent = "Done! Redirecting…";
          document.getElementById("import-url").value = "";
          setTimeout(() => {
            loaded["songs"] = false; // force refresh
            showTab("songs");
            status.textContent = "";
          }, 800);
        } catch (e) {
          status.style.color = "var(--accent2)";
          status.textContent = `Error: ${e.message}`;
        }
      }

      // ── Boot ──
      loadTabIfNeeded("songs");
    </script>
  </body>
</html>
