<!-- PROTOTYPE FRONTEND GENERATED USING CLAUDE TO TEST DB QUERIES -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>music.</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── CONFIG: plug your base URL here ── */
      /* edit API_BASE in the <script> section below */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0d;
        --surface: #161616;
        --border: #262626;
        --muted: #555;
        --text: #e8e8e0;
        --accent: #c8f060;
        --accent2: #f06060;
        --mono: "DM Mono", monospace;
        --serif: "Instrument Serif", serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── NAV ── */
      nav {
        display: flex;
        align-items: center;
        gap: 0;
        padding: 0 24px;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 100;
      }
      .logo {
        font-family: var(--serif);
        font-style: italic;
        font-size: 22px;
        color: var(--accent);
        padding: 14px 24px 14px 0;
        border-right: 1px solid var(--border);
        margin-right: 24px;
        letter-spacing: -0.5px;
      }
      .nav-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 18px 16px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition:
          color 0.15s,
          border-color 0.15s;
        position: relative;
        top: 1px;
      }
      .nav-btn:hover {
        color: var(--text);
      }
      .nav-btn.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .import-btn {
        font-size: x-large;
        background-color: #c8f060;
        text-align: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border-radius: 100%;
        border-bottom-width: 0px;
      }

      /* ── MAIN ── */
      main {
        flex: 1;
        padding: 32px 24px;
        max-width: 960px;
        width: 100%;
        margin: 0 auto;
      }

      .page {
        display: none;
      }
      .page.active {
        display: block;
      }

      .page-title {
        font-family: var(--serif);
        font-style: italic;
        font-size: 32px;
        color: var(--text);
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }
      .page-subtitle {
        color: var(--muted);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 28px;
      }

      /* ── BACK BUTTON ── */
      .back-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 6px 12px;
        cursor: pointer;
        margin-bottom: 24px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .back-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      /* ── LIST ── */
      .list {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }

      .list-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 16px;
        background: var(--surface);
        cursor: pointer;
        transition: background 0.1s;
        border-left: 3px solid transparent;
      }
      .list-item:hover {
        background: #1e1e1e;
        border-left-color: var(--accent);
      }

      .item-thumb {
        width: 44px;
        height: 44px;
        border-radius: 4px;
        background: var(--border);
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        color: var(--muted);
      }
      .item-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .item-info {
        flex: 1;
        min-width: 0;
      }
      .item-title {
        font-size: 13px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .item-meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-right {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .item-duration {
        font-size: 11px;
        color: var(--muted);
        min-width: 36px;
        text-align: right;
      }

      .play-btn {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          transform 0.15s,
          background 0.15s;
      }
      .play-btn:hover {
        transform: scale(1.1);
        background: #d8ff70;
      }
      .play-btn svg {
        margin-left: 2px;
      }

      .arrow-btn {
        width: 30px;
        height: 30px;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .arrow-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }

      .type-badge {
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        border: 1px solid var(--border);
        padding: 2px 6px;
        flex-shrink: 0;
      }

      /* ── LOADING / ERROR ── */
      .state-msg {
        padding: 48px 0;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
      }
      .state-msg.error {
        color: var(--accent2);
      }

      /* ── PLAYER ── */
      #player-page {
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 70vh;
        gap: 0;
      }
      #player-page.active {
        display: flex;
      }

      .player-art {
        width: 240px;
        height: 240px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 64px;
        color: var(--muted);
        margin-bottom: 32px;
        position: relative;
        overflow: hidden;
        border-radius: 10px;
      }
      .player-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .player-track {
        font-family: var(--serif);
        font-style: italic;
        font-size: 28px;
        text-align: center;
        margin-bottom: 6px;
        letter-spacing: -0.3px;
      }
      .player-artist {
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        margin-bottom: 40px;
      }

      .progress-wrap {
        width: 320px;
        margin-bottom: 12px;
      }
      .progress-bar {
        width: 100%;
        height: 3px;
        background: var(--border);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 8px;
      }
      .progress-fill {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 1s linear;
      }
      .progress-times {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.06em;
      }

      .player-controls {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 24px;
      }
      .ctrl-btn {
        width: 40px;
        height: 40px;
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .ctrl-btn:hover {
        color: var(--text);
        border-color: var(--muted);
      }
      .ctrl-play {
        width: 52px;
        height: 52px;
        background: var(--accent);
        border: none;
        color: #0d0d0d;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.15s;
      }
      .ctrl-play:hover {
        transform: scale(1.05);
      }

      .player-audio {
        display: none;
      }

      /* ── DETAIL HEADER ── */
      .detail-header {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 32px;
      }
      .detail-art {
        width: 120px;
        height: 120px;
        background: var(--surface);
        border: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        color: var(--muted);
        overflow: hidden;
      }
      .detail-art img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .detail-info {
        flex: 1;
      }
      .detail-type {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }
      .detail-title {
        font-family: var(--serif);
        font-style: italic;
        font-size: 28px;
        letter-spacing: -0.3px;
        margin-bottom: 8px;
      }
      .detail-meta {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }

      /* Now playing button */

      .now-playing {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #c8f060;
  color: #262626;
  border: none;
  padding: 10px 16px;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  font-family: system-ui, sans-serif;
}

.bars {
  display: flex;
  align-items: flex-end;
  height: 14px;
  gap: 3px;
}

.bars span {
  width: 3px;
  height: 6px;
  background: rgb(30, 30, 70);
  border-radius: 2px;
  animation: equalize 1s infinite ease-in-out;
}

.bars span:nth-child(2) {
  animation-delay: 0.2s;
}

.bars span:nth-child(3) {
  animation-delay: 0.4s;
}

.now-playing.paused .bars span {
  animation: none;
  height: 4px;
}

@keyframes equalize {
  0%, 100% {
    height: 4px;
  }
  50% {
    height: 14px;
  }
}
    </style>
  </head>
  <body>

    <main>
      <!-- SONGS -->

        <div class="page-title" style="display: flex; justify-content: space-between;">
          <span>Songs</span>

    <script>
      // ════════════════════════════════════════════
      //  CONFIG — edit this block
      // ════════════════════════════════════════════
      // const API_BASE = "http://localhost:3000"; // ← your API base URL

      const ENDPOINTS = {
        home: () => `/home`,
        albums: () => `/release-groups`,
        artists: () => `/artists`,
        albumTracks: (id) => `/release-groups/${id}/tracks`,
        artistTracks: (id) => `/artists/${id}/tracks`,
        nextTrackId: () => `/tracks/next`,
        prevTrackId: () => `/tracks/previous`,
        getTrackMetadata: (id) => `/tracks/${id}/metadata`,
        streamTrack: (id) => `/tracks/${id}/stream`,
        importUrl: () => `/import`,
        queue: () => `/queue`,
        searchTracks: (q, limit = 50) =>
          `/tracks/search?q=${encodeURIComponent(q)}&limit=${limit}&offset=0`,
          toggleLikeTrack: (id) => `/tracks/${id}/like`,
      };
      // ════════════════════════════════════════════

      // ── State ──
      let currentTab = "songs";
      let previousPage = null;
      const audio = document.getElementById("audio-player");
      let progressInterval = null;

      // ── Song search debounce ──
      let _songsSearchTimer = null;

      function debouncedSearchSongs(query) {
        clearTimeout(_songsSearchTimer);
        _songsSearchTimer = setTimeout(() => searchSongs(query), 300);
      }

      async function searchSongs(query) {
        const list = document.getElementById("songs-list");
        const sub = document.getElementById("songs-subtitle");

        // Empty query → fall back to the full library
        if (!query.trim()) {
          loaded["songs"] = false;
          loadSongs();
          return;
        }

        list.innerHTML = '<div class="state-msg">Searching…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.searchTracks(query));
          const songs = data.data ?? (Array.isArray(data) ? data : []);
          sub.textContent = `${songs.length} result${songs.length !== 1 ? "s" : ""} for "${query}"`;
          list.innerHTML = songs.length
            ? ""
            : '<div class="state-msg">No results found.</div>';
          songs.forEach((s) => list.appendChild(songItem(s)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Search failed: ${e.message}</div>`;
        }
      }

      // ── Helpers ──
      function fmt(ms) {
        if (!ms) return "?:??";
        const s = Math.floor(ms / 1000);
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }
      function fmtSec(s) {
        return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
      }
      function fmtDate(ms) {
        if (!ms) return "—";
        return new Date(ms).getFullYear();
      }
      async function apiFetch(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      }
      // From CHATGPT on Mar12: helper to fetch & play a random track
      async function playNext() {
        try {
          const nextTrackResponse = await apiFetch(ENDPOINTS.nextTrackId());
          await loadQueue()

          const track = nextTrackResponse.data

          const trackMetadataResponse = await apiFetch(
            ENDPOINTS.getTrackMetadata(track.track_id),
          );

          const trackMetadata = trackMetadataResponse.data

          updatePlayer(trackMetadata);

          navigator.mediaSession.metadata = new MediaMetadata({
            title: trackMetadata.title,
            artist: artistCredit(trackMetadata.artists),
            album: trackMetadata.release_group.title,
            artwork: [
              { src: trackMetadata.release_group.cover_art_url_thumbnail_small ?? "", sizes: "512x512", type: "image/jpeg" },
            ],
          });

          audio.src = ENDPOINTS.streamTrack(track.track_id);
          audio.load();
          await audio.play();
          document.getElementById("player-art").classList.add("spinning");
          showPlayState(true);
        } catch (err) {
          console.warn("Failed to play random track:", err);
          showPlayState(false);
        }
      }

      async function playPrevious() {
        try {
          const prevTrackResponse = await apiFetch(ENDPOINTS.prevTrackId());
          await loadQueue()

          const track = prevTrackResponse.data

          const trackMetadataResponse = await apiFetch(
            ENDPOINTS.getTrackMetadata(track.track_id),
          );

          const trackMetadata = trackMetadataResponse.data

          updatePlayer(trackMetadata);

          navigator.mediaSession.metadata = new MediaMetadata({
            title: trackMetadata.title,
            artist: artistCredit(trackMetadata.artists),
            album: trackMetadata.release_group.title,
            artwork: [
              { src: trackMetadata.release_group.cover_art_url_thumbnail_small ?? "", sizes: "512x512", type: "image/jpeg" },
            ],
          });

          audio.src = ENDPOINTS.streamTrack(track.track_id);
          audio.load();
          await audio.play();
          document.getElementById("player-art").classList.add("spinning");
          showPlayState(true);
        } catch (err) {
          console.warn("Failed to play random track:", err);
          showPlayState(false);
        }
      }

      function filterList(type) {
        const input = document.getElementById(`${type}-search`);
        if (!input) return;

        const q = input.value.toLowerCase();
        const list = document.getElementById(`${type}-list`);
        const items = list.querySelectorAll(".list-item");

        items.forEach((item) => {
          const text = item.dataset.search || "";
          item.style.display = text.includes(q) ? "" : "none";
        });
      }

      function updatePlayer(track) {
        // add a like button that toggles like status
            const likeBtn = document.createElement("button");
            likeBtn.className = "ctrl-btn";
            likeBtn.id = "player-like-btn";
            likeBtn.title = "Like";
            if (track.liked) {
              likeBtn.textContent = "❤️";
            } else {
              likeBtn.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
    `;
            }
            likeBtn.onclick = () => {
              fetch(ENDPOINTS.toggleLikeTrack(track.id), { method: "POST" })
              // based on the response, update the like button
              .then((r) => r.json())
              .then((r) => {
                if (r.data.liked) {
                  likeBtn.textContent = "❤️";
                } else {
                  likeBtn.innerHTML = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
  </svg>
    `;;
                }
              })
              .catch(() => {
                likeBtn.textContent = "❤️";
              });
            };
        try {
          document.getElementById("player-page").removeChild(document.getElementById("player-like-btn"));
        } catch {
          // do nothing
        }
        document.getElementById("player-page").appendChild(likeBtn);
        document.getElementById("player-track").textContent = track.title;
        document.getElementById("player-artist").textContent = artistCredit(
          track.artists,
        );
        document.getElementById("time-total").textContent = fmt(track.length);
        document.getElementById("progress-fill").style.width = "0%";
        document.getElementById("time-current").textContent = "0:00";

        track.release_group.cover_art_url_thumbnail_small ? 
        document.getElementById("player-art").innerHTML = `<img src="${track.release_group.cover_art_url_thumbnail_small}" />` : 
        () => {
          const artEl = document.getElementById("player-art");
          artEl.innerHTML = "♪";
          artEl.classList.remove("spinning")
        };
      }

      async function loadQueue() {
        const list = document.getElementById("queue-list");
        const sub = document.getElementById("queue-subtitle");

        list.innerHTML = '<div class="state-msg">Loading queue…</div>';

        try {
          const res = await apiFetch(ENDPOINTS.queue());
          const tracks = res.data.sort((a, b) => {return a.position > b.position}) ?? [];

          sub.textContent = `${tracks.length} upcoming`;

          list.innerHTML = tracks.length
            ? ""
            : '<div class="state-msg">Queue is empty.</div>';

          tracks.forEach((t, i) => {
            const el = songItem(t);

            // optional: show position
            const thumb = el.querySelector(".item-thumb");
            if (thumb) thumb.textContent = i + 1;

            list.appendChild(el);
          });
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      // ── Navigation ──
      function showPage(id) {
        document.querySelectorAll(".page").forEach((p) =>
          p.classList.remove("active")
        );
        document.getElementById(id).classList.add("active");

        if (id === "queue-page") loadQueue();
      }

      function showTab(tab) {
        currentTab = tab;
        previousPage = null;
        document.querySelectorAll(".nav-btn").forEach((b, i) => {
          b.classList.toggle(
            "active",
            ["songs", "albums", "artists"][i] === tab,
          );
        });
        showPage(`${tab}-page`);
        loadTabIfNeeded(tab);
      }

      function goBack() {
        if (previousPage) {
          showPage(previousPage);
          previousPage = null;
        } else {
          showTab(currentTab);
        }
      }

      // ── Tab loading ──
      const loaded = {};
      function loadTabIfNeeded(tab) {
        if (loaded[tab]) return;
        loaded[tab] = true;
        if (tab === "songs") loadSongs();
        if (tab === "albums") loadAlbums();
        if (tab === "artists") loadArtists();
      }

      // ── Songs ──
      async function loadSongs() {
        const list = document.getElementById("songs-list");
        const sub = document.getElementById("songs-subtitle");

        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';

        try {
          const res = await apiFetch(ENDPOINTS.home());
          await loadQueue();

          const topTracks = res.data?.topTracks?.data ?? [];
          const recentTracks = res.data?.recentTracks?.data ?? [];

          sub.textContent = ""; // remove noisy count

          list.innerHTML = "";

          // helper to render a section
          function renderSection(title, tracks) {
            if (!tracks.length) return;

            const section = document.createElement("div");
            section.style.marginBottom = "28px";

            const header = document.createElement("div");
            header.textContent = title;
            header.style.fontSize = "10px";
            header.style.letterSpacing = "0.12em";
            header.style.textTransform = "uppercase";
            header.style.color = "var(--muted)";
            header.style.marginBottom = "8px";

            const sectionList = document.createElement("div");
            sectionList.className = "list";

            tracks.slice(0, 5).forEach((t) => {
              sectionList.appendChild(songItem(t));
            });

            section.appendChild(header);
            section.appendChild(sectionList);

            list.appendChild(section);
          }

          renderSection("recent", recentTracks);
          renderSection("top", topTracks);

        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function artistCredit(artists) {
        if (!artists || !artists.length) return "";
        return [...artists]
          .sort((a, b) => (a.pos ?? 0) - (b.pos ?? 0))
          .map((a) => a.name + (a.joinphrase ?? ""))
          .join("");
      }

      function songItem(s) {
        const el = document.createElement("div");
        el.className = "list-item";
        const credit = artistCredit(s.artists);
        const album = s.release_group?.title ?? "";
        const meta = [credit, album].filter(Boolean).join(" · ");
        el.innerHTML = `
    ${s.release_group && s.release_group.cover_art_url_thumbnail_small ? `<img class='item-thumb' src="${s.release_group.cover_art_url_thumbnail_small}" />` : "<div class='item-thumb'>♪</div>"}
    <div class="item-info">
      <div class="item-title">${s.title}</div>
      <div class="item-meta">${meta}</div>
    </div>
    <div class="item-right">
      <span class="item-duration">${fmt(s.length)}</span>
      <button class="play-btn" title="Play">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#0d0d0d"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  `;
        el.querySelector(".play-btn").onclick = (e) => {
          e.stopPropagation();
          togglePlayPause()
          openPlayer(s);
          //  lock screen media controls
          if ("mediaSession" in navigator) {
            navigator.mediaSession.setActionHandler("nexttrack", () => {
              playNext();
            });

            navigator.mediaSession.setActionHandler("previoustrack", () => {
              playPrevious();
            });
            
            navigator.mediaSession.setActionHandler("pause", () => {
              pause()
            });
            
            navigator.mediaSession.setActionHandler("play", () => {
              play()
            });

            // Optional: disable seek buttons
            navigator.mediaSession.setActionHandler("seekforward", null);
            navigator.mediaSession.setActionHandler("seekbackward", null);
          }

          navigator.mediaSession.metadata = new MediaMetadata({
            title: s.title,
            artist: credit,
            album: album,
            artwork: [
              { src: s.release_group.cover_art_url_thumbnail_small ?? "", sizes: "512x512", type: "image/jpeg" },
            ],
          });
        };

        el.dataset.search = (
          s.title +
          " " +
          credit +
          " " +
          album
        ).toLowerCase();

        return el;
      }

      // ── Albums ──
      async function loadAlbums() {
        const list = document.getElementById("albums-list");
        const sub = document.getElementById("albums-subtitle");
        list.innerHTML = '<div class="state-msg">Loading albums…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.albums());
          const albums = Array.isArray(data)
            ? data
            : (data.release_groups ?? data.albums ?? data.data ?? []);
          sub.textContent = `${albums.length} releases`;
          list.innerHTML = albums.length
            ? ""
            : '<div class="state-msg">No albums found.</div>';
          albums.forEach((a) => list.appendChild(albumItem(a)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function albumItem(a) {
        const el = document.createElement("div");
        el.className = "list-item";
        el.innerHTML = `
    <div class="item-thumb">${a.cover_art_url_thumbnail_small ? `<img class='item-thumb' src="${a.cover_art_url_thumbnail_small}" alt="">` : "💿"}</div>
    <div class="item-info">
      <div class="item-title">${a.title}</div>
      <div class="item-meta">${fmtDate(a.first_release_date)}</div>
    </div>
    <div class="item-right">
      <span class="type-badge">${a.musicbrainz_primary_type ?? "album"}</span>
      <button class="arrow-btn" title="View album">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7V5z"/></svg>
      </button>
    </div>
  `;
        el.onclick = () => openAlbum(a);

        el.dataset.search = (
          a.title +
          " " +
          (a.musicbrainz_primary_type ?? "")
        ).toLowerCase();

        return el;
      }

      async function openAlbum(album) {
        previousPage = "albums-page";
        showPage("album-detail-page");

        const artEl = document.getElementById("album-detail-art");
        artEl.innerHTML = album.cover_art_url
          ? `<img src="${album.cover_art_url}" alt="">`
          : "💿";
        document.getElementById("album-detail-title").textContent = album.title;
        document.getElementById("album-detail-meta").innerHTML =
          `${album.musicbrainz_primary_type ?? "Album"} &nbsp;·&nbsp; ${fmtDate(album.first_release_date)}`;

        const list = document.getElementById("album-tracks-list");
        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';
        try {
          const res = await apiFetch(ENDPOINTS.albumTracks(album.id));
          const tracks = res.data.tracks ?? [];
          list.innerHTML = tracks.length
            ? ""
            : '<div class="state-msg">No tracks found.</div>';
          tracks.forEach((s, i) => {
            const el = songItem({...s, release_group: {
              title: album.title,
              cover_art_url: album.cover_art_url
            }});
            // prepend track number
            el.querySelector(".item-thumb").textContent = i + 1;
            list.appendChild(el);
          });
        } catch (e) {
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      // ── Artists ──
      async function loadArtists() {
        const list = document.getElementById("artists-list");
        const sub = document.getElementById("artists-subtitle");
        list.innerHTML = '<div class="state-msg">Loading artists…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.artists());
          const artists = Array.isArray(data)
            ? data
            : (data.artists ?? data.data ?? []);
          sub.textContent = `${artists.length} artists`;
          list.innerHTML = artists.length
            ? ""
            : '<div class="state-msg">No artists found.</div>';
          artists.forEach((a) => list.appendChild(artistItem(a)));
        } catch (e) {
          sub.textContent = "error";
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      function artistItem(a) {
        const el = document.createElement("div");
        el.className = "list-item";
        el.innerHTML = `
    <div class="item-thumb">🎤</div>
    <div class="item-info">
      <div class="item-title">${a.name}</div>
      <div class="item-meta">&nbsp;</div>
    </div>
    <div class="item-right">
      <button class="arrow-btn" title="View artist">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l8 7-8 7V5z"/></svg>
      </button>
    </div>
  `;
        el.onclick = () => openArtist(a);

        el.dataset.search = a.name.toLowerCase();

        return el;
      }

      async function openArtist(artist) {
        previousPage = "artists-page";
        showPage("artist-detail-page");

        document.getElementById("artist-detail-title").textContent =
          artist.name;
        document.getElementById("artist-detail-meta").textContent =
          "All tracks";

        const list = document.getElementById("artist-tracks-list");
        list.innerHTML = '<div class="state-msg">Loading tracks…</div>';
        try {
          const data = await apiFetch(ENDPOINTS.artistTracks(artist.id));
          const tracks = Array.isArray(data)
            ? data
            : (data.tracks ?? data.data ?? []);
          list.innerHTML = tracks.length
            ? ""
            : '<div class="state-msg">No tracks found.</div>';
          tracks.forEach((s) => list.appendChild(songItem(s)));
        } catch (e) {
          list.innerHTML = `<div class="state-msg error">Failed to load: ${e.message}</div>`;
        }
      }

      // ── Player ──
      async function openPlayer(song) {
        const res = await apiFetch(ENDPOINTS.getTrackMetadata(song.id)) 
        song = res.data

        previousPage =
          document.querySelector(".page.active")?.id ?? `${currentTab}-page`;

        updatePlayer(song);

        showPage("player-page");

        const streamUrl = ENDPOINTS.streamTrack(song.id);
        audio.src = streamUrl;
        audio.load();
        audio
          .play()
          .then(() => {
            showPlayState(true);
          })
          .catch((err) => {
            console.warn("Autoplay blocked or stream failed:", err);
            showPlayState(false);
          });
      }

      function showPlayState(playing) {
        document.getElementById("play-icon").style.display = playing
          ? "none"
          : "";
        document.getElementById("pause-icon").style.display = playing
          ? ""
          : "none";
      }

      function togglePlayPause() {
        if (audio.paused) {
          audio.play();
          document.getElementById("player-art").classList.add("spinning");
          document.getElementById("now-playing").classList.remove("paused");
          showPlayState(true);
        } else {
          audio.pause();
          document.getElementById("player-art").classList.remove("spinning");
          document.getElementById("now-playing").classList.add("paused");
          showPlayState(false);
        }
      }

      function play() {
          audio.play();
          document.getElementById("player-art").classList.add("spinning");
          document.getElementById("now-playing").classList.remove("paused");
          showPlayState(true);
      }

      function pause() {
          audio.pause();
          document.getElementById("player-art").classList.remove("spinning");
          document.getElementById("now-playing").classList.add("paused");
          showPlayState(false);
      }

      function seekRelative(secs) {
        audio.currentTime = Math.max(
          0,
          Math.min(audio.currentTime + secs, audio.duration || 0),
        );
      }

      audio.addEventListener("change", () => {});

      audio.addEventListener("timeupdate", () => {
        const cur = audio.currentTime;
        const dur = audio.duration;
        if (!dur) return;
        document.getElementById("time-current").textContent = fmtSec(cur);
        document.getElementById("progress-fill").style.width =
          `${(cur / dur) * 100}%`;
      });

      // CHATGPT Mar 12: override the 'ended' event to auto-play next random track
      audio.addEventListener("ended", () => {
        showPlayState(false);
        document.getElementById("player-art").classList.remove("spinning");
        document.getElementById("progress-fill").style.width = "100%";
        playNext(); // auto-trigger next track
      });

      // ── Import ──
      async function submitImport() {
        const url = document.getElementById("import-url").value.trim();
        const status = document.getElementById("import-status");
        if (!url) {
          status.textContent = "Please enter a URL.";
          status.style.color = "var(--accent2)";
          return;
        }
        status.style.color = "var(--muted)";
        status.textContent = "Submitting…";
        try {
          const r = await fetch(ENDPOINTS.importUrl(), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url }),
          });
          if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
          status.style.color = "var(--accent)";
          status.textContent = "Done! Redirecting…";
          document.getElementById("import-url").value = "";
          setTimeout(() => {
            loaded["songs"] = false; // force refresh
            showTab("songs");
            status.textContent = "";
          }, 800);
        } catch (e) {
          status.style.color = "var(--accent2)";
          status.textContent = `Error: ${e.message}`;
        }
      }

      // CHATGPT Mar 12: add a "Next" button to the player controls
      const controls = document.querySelector(".player-controls");
      const prevBtn = document.createElement("button");
      prevBtn.className = "ctrl-btn";
      prevBtn.title = "Prev";
      prevBtn.innerHTML = `
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
  <path d="M20 4v16l-12-8zM8 4h-2v16h2z"/>
</svg>
  `;
  prevBtn.onclick = () => {
        audio.pause();
        audio.currentTime = 0;
        playPrevious();
      };
      controls.appendChild(prevBtn);

      const nextBtn = document.createElement("button");
      nextBtn.className = "ctrl-btn";
      nextBtn.title = "Next";
      nextBtn.innerHTML = `
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M4 4v16l12-8zM16 4h2v16h-2z"/>
    </svg>
  `;
      nextBtn.onclick = () => {
        audio.pause();
        audio.currentTime = 0;
        playNext();
      };
      controls.appendChild(nextBtn);

      // Add queue button
      const queueBtn = document.createElement("button");
      queueBtn.className = "ctrl-btn";
      queueBtn.title = "Queue";
      queueBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 5h18v2H3zm0 6h12v2H3zm0 6h18v2H3z"/>
        </svg>
      `;
      queueBtn.onclick = () => {
        previousPage = "player-page";
        showPage("queue-page");
        loadQueue();
      };
      controls.appendChild(queueBtn);

      // ── Boot ──
      loadTabIfNeeded("songs");
    </script>
  </body>
</html>
